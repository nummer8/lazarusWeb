; 报表插件（独立 exe）。监听端口必须与宿主 hostdemo.ini 里的
; plugin.reports= 登记一致。

client=alpine
port=8873
theme=auto

; 跨插件导航：本进程只有 Reports 窗体。页面里点"打开仪表盘"/
; "打开便签页"/"返回首页"调用 OpenForm('Dashboard')/OpenForm('Notes')/
; OpenForm('Host')，本进程找不到这些窗体时按此映射推 JS 跳转。
; 路径用绝对路径 /p/<名>/ ，经宿主 lwroute 代理到对应插件进程；
; 首页是宿主根路径 / 。
page.Dashboard=/p/dash/
page.Notes=/p/notes/
page.Host=/
